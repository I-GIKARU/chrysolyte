name: Sync upstream

on:
  schedule:
    # Daily at 04:00 UTC.
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.merge.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge Ephy-kimotho/chrysolyte into main
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Ephy-kimotho/chrysolyte.git
          git fetch upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date with upstream."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Upstream has new commits:"
          git log --oneline HEAD..upstream/main

          if ! git merge --no-ff upstream/main -m "chore: sync upstream $(git rev-parse --short upstream/main)"; then
            echo "::error::Upstream merge has conflicts. Resolve locally and push."
            exit 1
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        if: steps.merge.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Build before pushing
        if: steps.merge.outputs.changed == 'true'
        run: |
          npm ci
          # Font downloads occasionally fail on a cold cache; one retry.
          npm run build || npm run build

      - name: Push the sync
        if: steps.merge.outputs.changed == 'true'
        run: git push origin HEAD:main

  # A push made with GITHUB_TOKEN does not trigger CI (GitHub's recursion
  # guard), so the normal workflow_run deploy never fires after a sync.
  # Call the reusable deploy workflow directly instead.
  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
