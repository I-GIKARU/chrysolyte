name: Deploy

on:
  # Deploy only after the CI workflow succeeds for this commit, so an
  # upstream/fork sync can never put a broken build live.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-chrysolyte-web
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check deployment secrets
        id: preflight
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$SSH_KEY" ]; then
            echo "::notice::Deployment skipped. Add repository secrets SSH_HOST, SSH_USER and SSH_KEY."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over SSH
        if: steps.preflight.outputs.ready == 'true'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o ConnectTimeout=20 \
            "$SSH_USER@$SSH_HOST" "TARGET_SHA=$TARGET_SHA bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/chrysolyte-web

          PREV=$(git rev-parse HEAD)
          echo "Previous commit: $PREV"
          git fetch origin main
          if [ -n "${TARGET_SHA:-}" ]; then
            git reset --hard "$TARGET_SHA"
          else
            git reset --hard origin/main
          fi
          echo "Deploying: $(git rev-parse --short HEAD)"

          build() {
            npm ci
            # Font downloads occasionally fail on a cold cache; one retry.
            npm run build || npm run build
            pm2 restart chrysolyte-web 2>/dev/null || pm2 start npm --name chrysolyte-web -- start -- -p 3002
            pm2 save >/dev/null
          }

          healthy() {
            for _ in $(seq 1 20); do
              curl -fsS -o /dev/null http://127.0.0.1:3002/ && return 0
              sleep 3
            done
            return 1
          }

          if ! build || ! healthy; then
            echo "::error::Health check failed — rolling back to $PREV"
            git reset --hard "$PREV"
            build || true
            exit 1
          fi

          echo "Deployment healthy at $(git rev-parse --short HEAD)."
          REMOTE
